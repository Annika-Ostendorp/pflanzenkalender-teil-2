<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pflanzen-Pflegekalender</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Pflanzen-Pflegekalender</h1>
    <nav>
      <button class="tab-btn active" data-tab="plants">Pflanzen</button>
      <button class="tab-btn" data-tab="overdue">
        Ueberfaellig
        <span id="overdue-badge" class="badge hidden">0</span>
      </button>
    </nav>
    <div id="header-user" class="header-user hidden">
      <span id="header-username" class="header-username"></span>
      <button class="btn-logout" id="btn-logout">Abmelden</button>
    </div>
  </div>
</header>

<!-- Auth screen — shown when not logged in -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">&#127807;</div>
      <h2>Pflanzen-Pflegekalender</h2>
      <p>Melde dich an oder erstelle ein neues Konto.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-auth="login">Anmelden</button>
      <button class="auth-tab" data-auth="register">Registrieren</button>
    </div>

    <!-- Login -->
    <div id="auth-form-login" class="auth-form">
      <div class="field">
        <label>Benutzername</label>
        <input type="text" id="login-username" autocomplete="username" placeholder="Benutzername">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="Passwort">
      </div>
      <div id="login-error" class="auth-error hidden"></div>
      <button class="btn-primary auth-submit" id="btn-do-login">Anmelden</button>
    </div>

    <!-- Register -->
    <div id="auth-form-register" class="auth-form hidden">
      <div class="field">
        <label>Benutzername</label>
        <input type="text" id="reg-username" autocomplete="username" placeholder="Benutzername">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="reg-password" autocomplete="new-password" placeholder="Passwort">
      </div>
      <div class="field">
        <label>Passwort wiederholen</label>
        <input type="password" id="reg-password2" autocomplete="new-password" placeholder="Passwort wiederholen">
      </div>
      <div id="reg-error" class="auth-error hidden"></div>
      <button class="btn-primary auth-submit" id="btn-do-register">Konto erstellen</button>
    </div>
  </div>
</div>

<div class="layout">

  <main id="main-content">

    <!-- Plants tab -->
    <div id="tab-plants" class="tab active">
      <div class="toolbar">
        <h2>Meine Pflanzen</h2>
        <button class="btn-primary" id="btn-add-plant">+ Pflanze hinzufuegen</button>
      </div>
      <div id="plants-grid" class="plants-grid"></div>
      <div id="plants-empty" class="empty-state hidden">
        <p>Noch keine Pflanzen vorhanden.</p>
        <button class="btn-primary" id="btn-add-plant-empty">+ Erste Pflanze hinzufuegen</button>
      </div>
    </div>

    <!-- Overdue tab -->
    <div id="tab-overdue" class="tab">
      <div class="toolbar">
        <h2>Ueberfaellige Aktionen</h2>
        <button class="btn-secondary" id="btn-refresh-overdue">Aktualisieren</button>
      </div>
      <div id="overdue-list"></div>
      <div id="overdue-empty" class="empty-state hidden">
        <p>Alle Pflanzen sind gut versorgt!</p>
      </div>
    </div>

  </main>

  <!-- Detail panel -->
  <aside id="detail-panel" class="detail-panel hidden">
    <div class="detail-header">
      <div class="detail-title">
        <h2 id="detail-name"></h2>
        <p id="detail-species" class="muted italic"></p>
      </div>
      <div class="detail-actions">
        <button class="btn-icon" id="btn-edit-plant" title="Bearbeiten">&#9998;</button>
        <button class="btn-icon btn-danger" id="btn-delete-plant" title="Loeschen">&#10006;</button>
        <button class="btn-icon" id="btn-close-detail" title="Schliessen">&#10005;</button>
      </div>
    </div>

    <div class="detail-meta">
      Standort: <strong id="detail-location"></strong>
    </div>

    <section class="detail-section">
      <h3>Pflegeplaene</h3>
      <div id="schedules-container"></div>
      <button class="btn-secondary btn-sm mt-s" id="btn-add-schedule">+ Plan hinzufuegen</button>
    </section>

    <section class="detail-section">
      <h3>Naechste Aktionen</h3>
      <div id="next-actions-container"></div>
    </section>

    <section class="detail-section">
      <div class="section-row">
        <h3>Aktionsprotokoll</h3>
        <button class="btn-primary btn-sm" id="btn-log-action">+ Protokollieren</button>
      </div>
      <div id="log-container"></div>
    </section>
  </aside>

</div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="btn-icon" id="modal-close">&#10005;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="modal-cancel">Abbrechen</button>
      <button class="btn-primary" id="modal-confirm">Speichern</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
